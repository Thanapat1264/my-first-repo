<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>นิสัยประจำวัน</title>
  <meta name="description" content="แอปติดตามนิสัยประจำวัน ใช้บนมือถือได้ ทำงานออฟไลน์ ข้อมูลเก็บในเครื่องของคุณ">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b120f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="นิสัยประจำวัน">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // ตั้งธีมที่เลือกไว้ก่อนวาดหน้าจอ เพื่อไม่ให้เห็นแสงวาบของธีมผิด
    try {
      var t = JSON.parse(localStorage.getItem('habit-tracker:v1')).settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* ใช้ธีมตามระบบ */ }
  </script>
</head>
<body>
  <div class="app" id="app">
    <main id="main">
      <section class="view" id="view-today" aria-labelledby="today-title"></section>
      <section class="view" id="view-stats" aria-labelledby="stats-title" hidden></section>
      <section class="view" id="view-settings" aria-labelledby="settings-title" hidden></section>
    </main>
  </div>

  <button class="fab" id="fab" type="button" data-action="new-habit" aria-label="เพิ่มนิสัยใหม่"></button>

  <nav class="tabbar" aria-label="เมนูหลัก">
    <div class="tabbar-inner" id="tabbar"></div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
  <div class="celebrate" id="celebrate" data-action="close-celebrate" hidden></div>

  <dialog id="dlg-form" aria-labelledby="form-title"><div class="sheet"></div></dialog>
  <dialog id="dlg-detail" aria-labelledby="detail-title"><div class="sheet"></div></dialog>
  <dialog id="dlg-confirm" aria-labelledby="confirm-title"><div class="sheet"></div></dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <noscript><p style="padding:24px;text-align:center">แอปนี้ต้องเปิดใช้งาน JavaScript</p></noscript>

  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
